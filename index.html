<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doughnut Chart</title>
    <link rel="stylesheet" href="resources/starter.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="js.js" defer></script>
  </head>
  <body>
    <main>
      <h1>These are our stats</h1>
      <section class="stat-list" aria-label="Statistik">
        <figure data-value="85">
          <svg viewBox="0 0 100 100">
            <circle class="track" />
            <circle class="progress" pathLength="100" />
            <circle class="marker" r="4" fill="red" />
          </svg>
          <figcaption>Consistency</figcaption>
        </figure>

        <figure data-value="95">
          <svg viewBox="0 0 100 100">
            <circle class="track" />
            <circle class="progress" pathLength="100" />
            <circle class="marker" r="4" fill="red" />
          </svg>
          <figcaption>Improvement</figcaption>
        </figure>

        <figure data-value="90">
          <svg viewBox="0 0 100 100">
            <circle class="track" />
            <circle class="progress" pathLength="100" />
            <circle class="marker" r="4" fill="red" />
          </svg>
          <figcaption>Branching</figcaption>
        </figure>
      </section>
      <input id="ranger" type="range" min="0" max="100" />
    </main>
  </body>
</html>
